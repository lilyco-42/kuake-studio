[package]
name = "kuake-studio-jni"
version = "0.5.4"
edition = "2021"
publish = false

# 独立 workspace：不并入桌面主 crate，避免改变主包的 crate-type / 依赖解析。
[workspace]

[lib]
name = "kuake_studio_jni"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# 复用桌面端同一份 Registry + axum 宿主（desktop 特性），前端 dist 一行不改。
kuake-studio = { path = "..", features = ["desktop"] }
serde_json = "1"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
