[package]
name = "kuake-studio"
version = "0.5.5"
edition = "2021"
description = "Quark 网盘客户端 —— lilyco 框架（Registry/App/Safety）+ shadcn/ui 前端；桌面安装包 + 移动/鸿蒙进程内原生库"
license = "MIT OR Apache-2.0"

# 桌面三平台（Windows / Linux / macOS）：编 [[bin]]，起本机 axum Web 宿主、
# 打真安装包并自动开浏览器。移动 / 鸿蒙只编 [lib] 的 C ABI，不开端口、不打开浏览器。
[features]
default = ["desktop"]
desktop = ["dep:axum", "dep:tokio", "dep:async-stream"]

[[bin]]
name = "kuake-studio"
path = "src/main.rs"
# 移动 / 鸿蒙 cargo build --no-default-features --lib 时不编这个 bin
# （它依赖 axum/tokio/打开浏览器），否则 --no-default-features 会连带编 bin 而失败。
required-features = ["desktop"]

[lib]
name = "kuake_studio"
path = "src/lib.rs"
# staticlib (.a)：Android JNI / iOS Swift / 鸿蒙 NAPI 宿主链接的进程内原生库。
#   刻意不编 cdylib：交叉到 aarch64-unknown-linux-ohos 等目标时没有平台 SDK 的
#   linker，产物 .so 会撞 "file in wrong format"；静态库只需 ar，六个 target 都能真编。
#   宿主用自己平台的 NDK / Xcode / DevEco 工具链把 .a 链进 native 层即可。
# rlib：桌面 bin 与 cargo test 依赖。
crate-type = ["staticlib", "rlib"]

[dependencies]
# lilyco 门面：默认特性 = CLI + MCP + core（纯 Rust，无图形重依赖）
# 用到的只有核心层：App / Registry / SafetyPolicy / executor / Progress
#
# CI 里必须用 git 依赖（不能写本机绝对路径）。crates.io 上的 lilyco 只到 0.2.3，
# 而这里用到的 ValueEnum / safety::Interactive 是 0.3.0 才有的，所以钉死 git rev。
# 本地开发想改 lilyco 源码时，临时换回 path 依赖即可（改完别提交）。
lilyco = { git = "https://github.com/lilyco-42/lilyco", rev = "3f5ce094a893bd22debb435994e8c885a00e1571" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自建 Web 宿主（仅 desktop 特性）：不复用 lilyco-gui 的页面，只借执行/取消/进度语义
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
async-stream = { version = "0.3", optional = true }
rand = "0.8"
# 上传前加密插件（src/crypt.rs）：AES-256-GCM 分块 + PBKDF2-HMAC-SHA256 派生密钥
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
# 自研夸克 API 后端（src/quark.rs）：直接走官方 HTTP 接口，不再依赖本机 kuake CLI
# 绝不开 "stream" 特性：它会拉入 wasm-streams，本地离线 registry 没有
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "blocking"] }
sha1 = { version = "0.10", features = ["compress"] }
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
qrcodegen = "1.8"
httpdate = "1.0"

[build-dependencies]
# 只在目标平台是 Windows 时生效（见 build.rs）：把 assets/kuake-studio.rc
# 里的 exe 图标 + 版本信息编进二进制。其他平台是空操作。
embed-resource = "3"
