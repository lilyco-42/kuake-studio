name: build

# 六个平台：桌面三平台出真安装包，移动 / 鸿蒙出进程内 FFI 原生库（不发假 App）：
#   windows -> 便携 zip + MSI（WiX v3，带开始菜单快捷方式和 exe 图标）
#   linux   -> tar.gz（含 .desktop 和 png 图标）
#   macos   -> 通用二进制（arm64 + x86_64 用 lipo 合成）+ .app 包
#   android-arm64 / ios-arm64 / ohos-arm64 -> libkuake_studio.a + C 头 + ABI 自检源码
#     宿主 App 用 JNI / Swift / NAPI 链接静态库，自己用 WebView 渲染前端 dist。
#     Android / 鸿蒙的 C 代码用 tools/cc-aarch64-musl.sh（zig cc 的 aarch64 musl sysroot）交叉编译；
#     逐个 .o 校验 arm64，杜绝 host gcc 混进归档造成的「假成功」。
#
# 触发：推分支（验证能编）、推 v* 标签（额外发布到 Releases）、手动。
# 注意 workflow_dispatch 只有在默认分支上存在本文件时才出现，所以先推 main 再点。

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用的标签名（仅手动发布时填，如 v0.1.0）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 关掉增量，CI 里增量只会让缓存变脏
  CARGO_INCREMENTAL: "0"

jobs:
  # ── 快速门禁：格式 / lint / 单测（只有一台机器，几十秒）────────────────
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      # 移动 / 鸿蒙用 --no-default-features：不编 axum/tokio，只留核心库 + C ABI
      - name: cargo test（无 desktop 特性）
        run: cargo test --locked --no-default-features --lib

      - name: C ABI 端到端自检（真链接静态库）
        run: |
          set -euo pipefail
          cargo build --locked --no-default-features --lib
          cc -std=c11 -Wall -Wextra -I include -o /tmp/ks-abi-selftest tools/abi-selftest.c target/debug/libkuake_studio.a -lpthread -ldl -lm
          /tmp/ks-abi-selftest

  # ── 各平台打包 ───────────────────────────────────────────────────────
  package:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            kind: desktop
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x64
            kind: desktop
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-universal
            kind: desktop
            os: macos-latest
            target: universal2
          - name: android-arm64
            kind: native
            os: ubuntu-latest
            target: aarch64-linux-android
          - name: ios-arm64
            kind: native
            os: macos-latest
            target: aarch64-apple-ios
          - name: ohos-arm64
            kind: native
            os: ubuntu-latest
            target: aarch64-unknown-linux-ohos

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: oven-sh/setup-bun@v2
        if: matrix.kind == 'desktop'
        with:
          # bun.lock 是 1.4 写的（lockfileVersion 2）；钉死版本免得 latest 换格式
          bun-version: "1.4.4"

      # bun.lock / bunfig.toml 里钉的是国内镜像（本地装依赖快），
      # GitHub runner 在境外，换成官方源。锁文件内容一致，--frozen-lockfile 仍然通过。
      - name: 前端依赖切到官方源
        if: matrix.kind == 'desktop'
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["frontend/bun.lock", "frontend/bunfig.toml"]) {
              if (!fs.existsSync(f)) continue;
              const s = fs.readFileSync(f, "utf8")
                .replaceAll("https://registry.npmmirror.com/", "https://registry.npmjs.org/");
              fs.writeFileSync(f, s);
            }
            console.log("registry -> npmjs");
          '

      - name: 构建前端
        if: matrix.kind == 'desktop'
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      # ── Windows ─────────────────────────────────────────────────────
      - name: 构建（windows）
        if: matrix.name == 'windows-x64'
        run: cargo build --release --locked --bin kuake-studio

      - name: 自检（windows）
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = ".\target\release\kuake-studio.exe"

          # 1) schema 必须能出 19 条命令（进程能起、Registry 装配正常）
          $schema = & $exe --schema
          if ($LASTEXITCODE -ne 0) { throw "---schema 退出码 $LASTEXITCODE" }
          $cmds = ($schema | ConvertFrom-Json).Count
          Write-Host "schema 命令数: $cmds"
          if ($cmds -lt 19) { throw "schema 命令数异常: $cmds" }

          # 2) 真起一次 Web 服务，确认 dist 找得到、/api/boot 通
          $env:KUAKE_STUDIO_NO_OPEN = "1"
          $env:KUAKE_STUDIO_PORT = "8791"
          $proc = Start-Process -FilePath $exe -PassThru -NoNewWindow
          try {
            $ok = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $boot = Invoke-RestMethod "http://127.0.0.1:8791/api/boot" -TimeoutSec 2
                $ok = $true
                break
              } catch { }
            }
            if (-not $ok) { throw "/api/boot 一直没响应" }
            if ($boot.name -ne "kuake-studio") { throw "boot.name 异常: $($boot.name)" }
            Write-Host "boot ok: $($boot.name) $($boot.version) kuake=$($boot.kuake)"
            $ui = Invoke-WebRequest "http://127.0.0.1:8791/" -TimeoutSec 5
            if ($ui.StatusCode -ne 200) { throw "首页状态码 $($ui.StatusCode)" }
            if ($ui.Content -notmatch '<div id="root">') { throw "首页不像前端产物" }
            Write-Host "首页 ok: $($ui.RawContentLength) 字节"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          # 3) exe 版本资源必须等于 Cargo.toml 版本（build.rs 从 CARGO_PKG_VERSION 生成，防漂移）
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "exe FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion) 期望=$ver"
          if ($vi.FileVersion -notlike "$ver*" -or $vi.ProductVersion -notlike "$ver*") {
            throw "exe 版本资源与 Cargo.toml 不一致: $ver"
          }

      - name: 打包（windows：便携 zip + MSI）
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.*)"').Matches[0].Groups[1].Value
          $stage = "pkg\kuake-studio-$ver-windows-x64"
          Write-Host "版本 $ver -> $stage"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target\release\kuake-studio.exe" $stage
          Copy-Item "run.bat" $stage
          Copy-Item "README.md" $stage
          Copy-Item -Recurse "frontend\dist" "$stage\dist"

          # 便携版：解压即用（exe 旁边的 dist 会被 default_dist() 优先认）
          Compress-Archive -Path "$stage\*" -DestinationPath "pkg\kuake-studio-$ver-windows-x64.zip" -Force
          Write-Host "zip: $((Get-Item "pkg\kuake-studio-$ver-windows-x64.zip").Length) 字节"

          # 安装包：heat 收文件清单 -> candle 编 -> light 链接
          $wix = $null
          foreach ($c in @($env:WIX, "C:\Program Files (x86)\WiX Toolset v3.14\bin", "C:\Program Files (x86)\WiX Toolset v3.11\bin")) {
            if ($c -and (Test-Path (Join-Path $c "candle.exe"))) { $wix = $c; break }
          }
          if (-not $wix) {
            choco install wixtoolset --no-progress -y
            $wix = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }
          Write-Host "WiX: $wix"
          $pkgDir = (Resolve-Path $stage).Path
          $ico = (Resolve-Path "assets\kuake-studio.ico").Path

          & "$wix\heat.exe" dir $pkgDir -cg Payload -dr INSTALLFOLDER `
              -gg -srd -var var.PkgDir -out wix\gen.wxs
          if ($LASTEXITCODE -ne 0) { throw "heat 失败: $LASTEXITCODE" }

          & "$wix\candle.exe" -arch x64 "-dVersion=$ver" "-dPkgDir=$pkgDir" "-dIcoPath=$ico" `
              -out wix\ wix\main.wxs wix\gen.wxs
          if ($LASTEXITCODE -ne 0) { throw "candle 失败: $LASTEXITCODE" }

          & "$wix\light.exe" -sval -out "pkg\kuake-studio-$ver-windows-x64.msi" `
              wix\main.wixobj wix\gen.wixobj
          if ($LASTEXITCODE -ne 0) { throw "light 失败: $LASTEXITCODE" }

          Write-Host "msi: $((Get-Item "pkg\kuake-studio-$ver-windows-x64.msi").Length) 字节"

      # ── Linux ───────────────────────────────────────────────────────
      - name: 构建（linux）
        if: matrix.name == 'linux-x64'
        run: cargo build --release --locked --bin kuake-studio

      - name: 自检（linux）
        if: matrix.name == 'linux-x64'
        run: |
          set -euo pipefail
          exe=target/release/kuake-studio
          cmds=$($exe --schema | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "schema 命令数: $cmds"
          test "$cmds" -ge 19

          KUAKE_STUDIO_NO_OPEN=1 KUAKE_STUDIO_PORT=8791 ./target/release/kuake-studio &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            sleep 0.25
            if curl -sf http://127.0.0.1:8791/api/boot > /tmp/boot.json; then break; fi
          done
          python3 -c 'import json; d=json.load(open("/tmp/boot.json")); assert d["name"]=="kuake-studio", d; print("boot ok:", d["name"], d["version"])'
          curl -sf http://127.0.0.1:8791/ | grep -q '<div id="root">'
          echo "首页 ok"

      - name: 打包（linux：tar.gz）
        if: matrix.name == 'linux-x64'
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          stage="pkg/kuake-studio-$ver-linux-x64"
          mkdir -p "$stage"
          cp target/release/kuake-studio "$stage/"
          cp README.md "$stage/"
          cp assets/kuake-studio.desktop assets/kuake-studio-1024.png "$stage/"
          cp tools/install-linux-desktop.sh "$stage/install.sh"
          cp -r frontend/dist "$stage/dist"
          # 便携版启动器：不能用仓库里的 run.sh（它写死了本机共享 target 路径）
          cat > "$stage/start.sh" <<'EOS'
          #!/usr/bin/env bash
          # cd 到自身目录，让 kuake-studio 找到同级的 dist/
          cd "$(dirname "$0")" || exit 1
          exec ./kuake-studio "$@"
          EOS
          chmod +x "$stage/start.sh" "$stage/kuake-studio" "$stage/install.sh"
          tar -C pkg -czf "pkg/kuake-studio-$ver-linux-x64.tar.gz" "kuake-studio-$ver-linux-x64"
          ls -l pkg/

      # ── macOS ───────────────────────────────────────────────────────
      - name: 构建（macos：两个架构 + lipo 合成通用二进制）
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          cargo build --release --locked --bin kuake-studio --target aarch64-apple-darwin
          cargo build --release --locked --bin kuake-studio --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/kuake-studio \
            target/aarch64-apple-darwin/release/kuake-studio \
            target/x86_64-apple-darwin/release/kuake-studio
          lipo -info target/universal/kuake-studio
          file target/universal/kuake-studio

      - name: 自检（macos）
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          exe=target/universal/kuake-studio
          cmds=$($exe --schema | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "schema 命令数: $cmds"
          test "$cmds" -ge 19

      - name: 打包（macos：通用 tar.gz + .app）
        if: matrix.name == 'macos-universal'
        run: |
          set -euo pipefail
          # bsdtar 默认给带扩展属性的文件塞 ._ 副本，打进 tar 就是垃圾；禁掉
          export COPYFILE_DISABLE=1
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          stage="pkg/kuake-studio-$ver-macos-universal"
          mkdir -p "$stage"
          cp target/universal/kuake-studio "$stage/"
          cp README.md "$stage/"
          cp -r frontend/dist "$stage/dist"

          # .app 包：exe 放在 Contents/MacOS/ 下，dist 也放这儿（default_dist 认 exe 同级 dist）
          app="pkg/kuake-studio-$ver-macos-universal/kuake-studio.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/universal/kuake-studio "$app/Contents/MacOS/"
          cp -r frontend/dist "$app/Contents/MacOS/dist"

          # 从 1024 png 生成 icns
          iconset="$RUNNER_TEMP/AppIcon.iconset"
          rm -rf "$iconset"; mkdir -p "$iconset"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz assets/kuake-studio-1024.png --out "$iconset/icon_${sz}x${sz}.png" >/dev/null
            dbl=$((sz * 2))
            sips -z $dbl $dbl assets/kuake-studio-1024.png --out "$iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/AppIcon.icns"

          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>kuake-studio</string>
            <key>CFBundleDisplayName</key><string>夸克网盘</string>
            <key>CFBundleIdentifier</key><string>dev.lilyco.kuake-studio</string>
            <key>CFBundleVersion</key><string>VER_PLACEHOLDER</string>
            <key>CFBundleShortVersionString</key><string>VER_PLACEHOLDER</string>
            <key>CFBundleExecutable</key><string>kuake-studio</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          sed -i '' "s/VER_PLACEHOLDER/$ver/g" "$app/Contents/Info.plist"
          # 未签名：去掉隔离标记后可直接双击
          codesign --force --deep --sign - "$app" || echo "ad-hoc 签名失败，不影响使用"

          find "$stage" -name '._*' -delete
          tar -C pkg -czf "pkg/kuake-studio-$ver-macos-universal.tar.gz" "kuake-studio-$ver-macos-universal"
          ls -l pkg/

      # ── Android (arm64)：zig cc 交叉编 C，不依赖 NDK ──────────────────────
      - name: 构建（android arm64 静态库）
        if: matrix.name == 'android-arm64'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          curl -fsSL "https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig-sdk
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig-sdk --strip-components=1
          export PATH="/tmp/zig-sdk:$PATH"
          zig version
          export CC_aarch64_linux_android="$PWD/tools/cc-aarch64-musl.sh"
          # cc-rs 对 android 目标会探测 llvm-ar，失败就拼 ${target}-ar；runner 两者都无 → 显式用 GNU ar（只打包 .a，不链接）
          export AR_aarch64_linux_android=ar
          cargo build --release --locked --no-default-features --lib --target aarch64-linux-android

      # ── iOS (arm64)：只有 macOS runner 有 Xcode / iPhoneOS SDK / xcrun ──────
      - name: 构建（ios arm64 静态库）
        if: matrix.name == 'ios-arm64'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK: $sdk"
          export SDKROOT="$sdk"
          export IPHONEOS_DEPLOYMENT_TARGET=13.0
          cargo build --release --locked --no-default-features --lib --target aarch64-apple-ios

      # ── 鸿蒙 / OpenHarmony (arm64)：Rust 官方 target + zig cc 交叉编 C ─────
      - name: 构建（鸿蒙 arm64 静态库）
        if: matrix.name == 'ohos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-unknown-linux-ohos
          curl -fsSL "https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig-sdk
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig-sdk --strip-components=1
          export PATH="/tmp/zig-sdk:$PATH"
          zig version
          # 与 Android 同理：显式指定归档器，避免 runner 镜像变化后 cc-rs 拼出不存在的交叉 ar
          export CC_aarch64_unknown_linux_ohos="$PWD/tools/cc-aarch64-musl.sh"
          export AR_aarch64_unknown_linux_ohos=ar
          cargo build --release --locked --no-default-features --lib --target aarch64-unknown-linux-ohos

      - name: 自检（native：纯 arm64 归档 + C ABI 符号）
        if: matrix.kind == 'native'
        shell: bash
        run: |
          set -euo pipefail
          lib="$PWD/target/${{ matrix.target }}/release/libkuake_studio.a"
          test -s "$lib"
          tmp="$RUNNER_TEMP/ks-obj-check"
          rm -rf "$tmp"; mkdir -p "$tmp"
          (cd "$tmp" && ar x "$lib")
          # 整库逐个 .o 校验：任何一个非 aarch64/arm64 都算失败
          total=$(find "$tmp" -name "*.o" | wc -l | tr -d "[:space:]")
          arm=$(find "$tmp" -name "*.o" -exec file {} + | grep -Eci "aarch64|arm64" || true)
          echo "目标文件 $total 个，其中 arm64 $arm 个"
          test "$total" -ge 100
          test "$total" -eq "$arm"
          # 先落盘再 grep：grep -q 提前退出会让 nm/strings 收到 SIGPIPE，pipefail 下误判失败
          nm -g "$lib" > "$tmp/syms.txt" 2>/dev/null || true
          if ! grep -q kuake_studio_version "$tmp/syms.txt"; then
            strings "$lib" > "$tmp/strings.txt"
            grep -q kuake_studio_version "$tmp/strings.txt"
          fi
          echo "C ABI 符号 kuake_studio_version 已导出"

      - name: 打包（native：静态库 + C 头 + ABI 自检源码，非安装包）
        if: matrix.kind == 'native'
        shell: bash
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="kuake-studio-$ver-${{ matrix.name }}"
          target="${{ matrix.target }}"
          stage="pkg/$name"
          mkdir -p "$stage/include" "$stage/tools"
          cp "target/$target/release/libkuake_studio.a" "$stage/"
          cp include/kuake_studio.h "$stage/include/"
          cp tools/abi-selftest.c "$stage/tools/"
          if [ "${{ matrix.name }}" = "ios-arm64" ]; then
            cat > "$stage/README-native.md" <<'EOS'
          # kuake-studio 进程内原生库（iOS arm64）

          这个包不是可安装的 App，也没有应用商店签名。内容：

          - libkuake_studio.a：纯 arm64 静态库，导出 kuake_studio_* C ABI
          - include/kuake_studio.h：头文件
          - tools/abi-selftest.c：host 架构可编译运行的 ABI 自检
          - BUILD_INFO.txt：版本 / Rust target / 构建方式

          复现构建：macOS + Xcode 16，rustup target add aarch64-apple-ios，
          xcrun --sdk iphoneos --show-sdk-path 设入 SDKROOT，
          IPHONEOS_DEPLOYMENT_TARGET=13.0，
          cargo build --release --no-default-features --lib --target aarch64-apple-ios。

          宿主 App（iOS Swift）把 .a 链进原生层，自己用 WebView 渲染前端 dist；
          启动时先调 kuake_studio_set_cookie 注入夸克凭据，
          再调 kuake_studio_schemas() / kuake_studio_call() 驱动同一套命令。
          本库不启动 HTTP 服务、不打开浏览器、不读本机 .env、不生成 token。

          桌面三平台（Windows / Linux / macOS）请用对应安装包，不用这个库。
          EOS
          else
            cp tools/cc-aarch64-musl.sh "$stage/tools/"
            cat > "$stage/README-native.md" <<'EOS'
          # kuake-studio 进程内原生库（Android / 鸿蒙 arm64）

          这个包不是可安装的 App，也没有应用商店签名。内容：

          - libkuake_studio.a：纯 arm64 静态库，导出 kuake_studio_* C ABI
          - include/kuake_studio.h：头文件
          - tools/abi-selftest.c：host 架构可编译运行的 ABI 自检
          - tools/cc-aarch64-musl.sh：Android / 鸿蒙 C 代码交叉编译 wrapper（zig cc）
          - 复现构建：rustup target add <target> + zig 0.17.1，设 CC_<target> 指向本 wrapper；
            Android 还需 AR_aarch64_linux_android=ar（cc-rs 在 runner 上找不到 ${target}-ar），
            cargo build --release --no-default-features --lib --target <target>
          - BUILD_INFO.txt：版本 / Rust target / 构建方式

          宿主 App（Android Kotlin/JNI、鸿蒙 ArkTS/NAPI）把 .a 链进原生层，
          自己用 WebView 渲染前端 dist；启动时先调 kuake_studio_set_cookie 注入夸克凭据，
          再调 kuake_studio_schemas() / kuake_studio_call() 驱动同一套命令。
          本库不启动 HTTP 服务、不打开浏览器、不读本机 .env、不生成 token。

          桌面三平台（Windows / Linux / macOS）请用对应安装包，不用这个库。
          EOS
          fi
          cat > "$stage/BUILD_INFO.txt" <<EOS
          version=$ver
          rust_target=$target
          crate_type=staticlib
          features=--no-default-features
          EOS
          tar -C pkg -czf "pkg/$name.tar.gz" "$name"
          ls -l "pkg/$name.tar.gz"

      # ── 收集产物 ────────────────────────────────────────────────────
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            pkg/*.zip
            pkg/*.msi
            pkg/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ── Android APK：可直接安装的 App（不需要 Android Studio / Gradle）────
  # 用 aapt2 + javac + d8 + zipalign + apksigner 纯命令行打包，
  # 与 package 里的 android-arm64 静态库包并存：那个给宿主 App 链接，
  # 这个给普通用户双击图标即用（arm64 真机 + x86_64 模拟器同一份 APK）。
  android-apk:
    name: android-apk
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-apk

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: 前端依赖切到官方源
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            for (const f of ["frontend/bun.lock", "frontend/bunfig.toml"]) {
              if (!fs.existsSync(f)) continue;
              fs.writeFileSync(f, fs.readFileSync(f, "utf8")
                .replaceAll("https://registry.npmmirror.com/", "https://registry.npmjs.org/"));
            }
          '

      - name: 构建前端
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run build

      - name: 环境自检（NDK / build-tools / JDK）
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/ndk/*/ || true
          ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/build-tools/*/ || true
          java -version

      - name: 交叉编译 JNI 库（arm64 + x86_64）
        shell: bash
        run: ./android/tools/build-jni.sh aarch64-linux-android x86_64-linux-android

      - name: 打包签名 APK
        shell: bash
        run: ./android/tools/build-apk.sh

      - name: 自检（APK 结构 / 签名 / 双 ABI）
        shell: bash
        run: |
          set -euo pipefail
          apk=$(ls -1 pkg/*.apk | head -1)
          test -s "$apk"
          BT=$(ls -d "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/build-tools/*/ | sort -V | tail -1)
          "$BT/aapt" dump badging "$apk" | grep -E "package:|sdkVersion|targetSdkVersion|application-label|native-code"
          "$BT/apksigner" verify --verbose --min-sdk-version 24 "$apk"
          unzip -l "$apk" | grep -E "AndroidManifest.xml|classes.dex|assets/dist.zip|lib/.*libkuake_studio_jni.so"
          # 两个 ABI 缺一不可（arm64 真机 + x86_64 模拟器）
          abis=$(unzip -l "$apk" | grep -c "lib/.*libkuake_studio_jni.so")
          echo "ABI 数量: $abis"
          test "$abis" -ge 2
          ls -l pkg/

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: pkg/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── 打标签时发布到 Releases ──────────────────────────────────────────
  release:
    name: release
    needs: [package, android-apk]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列产物
        run: ls -lR dist

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          echo "发布 $TAG 到 $REPO"
          # 用 --notes-file + 单引号：--notes "..." 里的反引号会被 bash 当命令替换吃掉，文案里的文件名会整个消失
          {
            echo "夸克网盘客户端 $TAG：桌面三平台安装包 + Android APK + iOS / 鸿蒙进程内原生库。"
            echo
            printf '%s\n' \
              '- Windows：`kuake-studio-*-windows-x64.zip`（解压即用）/ `*.msi`（安装包）' \
              '- Linux：`kuake-studio-*-linux-x64.tar.gz` 解压后运行一次 `./install.sh`（桌面图标 + 开机自启，双击即用）' \
              '- macOS：`kuake-studio-*-macos-universal.tar.gz` 或解压出的 `kuake-studio.app`（未签名，首次打开需右键 → 打开）' \
              '- Android：`kuake-studio-*-android.apk` 直接装（arm64 真机 + x86_64 模拟器同一份，debug 签名）' \
              '' \
              '桌面三平台启动后都会自动打开浏览器，用户无需知道 IP / 端口（服务只监听 127.0.0.1:8787）。' \
              '首次运行在「账号」页点「扫码登录」用夸克 App 扫一下即可；也可设置 `KUAKE_COOKIE` 或写进 `~/.config/kuake/.env`。' \
              '默认走内置原生夸克 API，无需安装 kuake CLI；设 KUAKE_STUDIO_BACKEND=cli 才回退到子进程。' \
              '' \
              '### Android APK 怎么用' \
              '' \
              '- 传到手机点开安装，首次需允许「安装未知来源应用」；装完点图标即用。' \
              '- App 内是 WebView + 进程内 axum，界面与桌面包完全一致；arm64 真机与 x86_64 模拟器同一份包。' \
              '- debug 自签名、不上应用商店；扫码登录在 App 里同样可用。' \
              '' \
              '### 给宿主 App 链的静态库' \
              '' \
              '- Android：`kuake-studio-*-android-arm64.tar.gz`（aarch64 静态库 + C 头 + ABI 自检源码）' \
              '- iOS：`kuake-studio-*-ios-arm64.tar.gz`（arm64 静态库 + C 头 + ABI 自检源码）' \
              '- 鸿蒙 / OpenHarmony：`kuake-studio-*-ohos-arm64.tar.gz`（aarch64 静态库 + C 头 + ABI 自检源码）' \
              '' \
              '这三个包不是可安装的 App，也没有应用商店签名。宿主 App 用 JNI / Swift / NAPI 把 libkuake_studio.a' \
              '链进原生层，自己用 WebView 渲染前端 dist；启动时先调 kuake_studio_set_cookie 注入夸克凭据，' \
              '再调 kuake_studio_schemas / kuake_studio_call 驱动同一套命令。' \
              '库不启动 HTTP 服务、不打开浏览器、不读本机 .env；要装到手机上用请下 APK。'
          } > release-notes.md
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* -R "$REPO" --clobber
            gh release edit "$TAG" -R "$REPO" --notes-file release-notes.md
          else
            gh release create "$TAG" dist/* -R "$REPO" \
              --title "kuake-studio $TAG" \
              --notes-file release-notes.md
          fi
